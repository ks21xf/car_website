
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add a Car</title>
</head>
<body>
    <h1>Add a Car</h1>

    <form id="car-form">
        <label>
            Make:
            <input type="text" id="make" required value="luigi">
        </label>

        <br><br>

        <label>
            Model:
            <input type="text" id="model" required value ="mangione">
        </label>

        <br><br>

        <label>
            Year:
            <input type="number" id="year" required value = "2002">
        </label>

          <label for="photo-upload">Choose a photo:</label>
        <input
            type="file"
            id="photo-upload"
            name="photo"
            accept="image/png, image/jpeg, image/webp"
            multiple
        />
        <br><br>

        <button type="submit">Add Car</button>
    </form>

    <p id="result"></p>

    <script>
        const form = document.getElementById("car-form");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            // Collect the form values
            const formData = new FormData();

            formData.append('make',document.getElementById("make").value),
            formData.append('model',document.getElementById("model").value),
            formData.append('year',Number(document.getElementById("year").value)),
            formData.append('car-img',document.getElementById("photo-upload").files[0])
                console.log("Form data entries:", [...formData.entries()]);

            console.log(document.getElementById("photo-upload").files[0])
            try {
                // Send a POST request to Flask
                const response = await fetch( "http://localhost:5000/api/car",
                    {   method: "POST",
                        body: formData,
                    });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Request failed");

                document.getElementById("result").textContent = data.message;
                form.reset();

            } catch (error) {
                console.log(error)
                document.getElementById("result").textContent =error.message;
            }

        });
    </script>
</body>
</html>
