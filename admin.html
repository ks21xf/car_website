
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal</title>
</head>
<body>
    <h1>Add a Car</h1>

    <form id="car-form">
        <label>
            Make:
            <input type="text" id="make" required >
        </label>

        <br><br>

        <label>
            Model:
            <input type="text" id="model" required >
        </label>

        <br><br>

        <label>
            Year:
            <input type="number" id="year" required>
        </label>

        <label>
            Price:
            <input type="number" id="price" required >
        </label>

        <label>
            Mileage:
            <input type="number" id="mileage" required>
        </label>

        <label>
            Number of Seats:
            <input type="number" id="seats" required>
        </label>

          <label for="photo-upload">Choose a photo:</label>
        <input
            type="file"
            id="photo-upload"
            name="photo"
            accept="image/png, image/jpeg, image/webp"
            multiple
        />

        <div id = "fuel_type" >
            <h4>Fuel Type:</h4>
            <input type="radio" id="gasoline" name="fuel_type" value="gasoline" />
            <label for="css">Gasoline</label>
            <input type="radio" id="deisel" name="fuel_type" value="deisel" />
            <label for="css">Deisel</label>
            <input type="radio" id="electric" name="fuel_type" value="electric" />
            <label for="css">Electric</label>
        </div>

        <div id = "transmission">
            <h4>Transmission:</h4>
            <input type="radio" id="manual" name="transmission" value="manual" />
            <label for="css">Manual</label>
            <input type="radio" id="automatic" name="transmission" value="automatic" />
            <label for="css">Automatic</label>
        </div>

        <br><br>

        <button type="submit">Add Car</button>
    </form>

    <p id="result"></p>

    <h1>Delete a Car</h1>
    <form id = "car-deletion-form">
        <label>
            Enter ID of car to delete:
            <input type="text" id="car-to-delete">
        </label>
        <button type="delete">Delete Car</button>

    </form>
    <p id="result-deletion"></p>



    <script>
        const deleteForm = document.getElementById("car-deletion-form")
        deleteForm.addEventListener("submit", async (event)=>{
            event.preventDefault();

            const formData = new FormData()
            formData.append('cid',document.getElementById("car-to-delete").value)
            try {
                    // Send a POST request to Flask
                    const response = await fetch( "http://localhost:5000/api/deletecar",
                        {   method: "POST",
                            body: formData,
                        });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Request failed");

                    document.getElementById("result-deletion").textContent =data.Message;
                    form.reset();

                } catch (error) {
                    console.log(error)
                    document.getElementById("result-deletion").textContent =error.message;
                }


        });

        const form = document.getElementById("car-form");

        form.addEventListener("submit", async (event) => {
            //checks
            if (document.querySelector('input[name="fuel_type"]:checked')== undefined){
                alert("please select a fuel type")
                return
            }
            if(document.getElementById("photo-upload").files.length ==0){
                alert("Please upload at least one photo of the car")
                return
            }
            if (document.querySelector('input[name="transmission"]:checked')== undefined){
                alert("please select a transmission")
                return
            }

            event.preventDefault();

            // Collect the form values
            const formData = new FormData();

            formData.append('make',document.getElementById("make").value)
            formData.append('model',document.getElementById("model").value)
            formData.append('year',Number(document.getElementById("year").value))
            formData.append('price',document.getElementById("price").value)
            formData.append('mileage',document.getElementById("mileage").value)
            formData.append('seats',document.getElementById("seats").value)
            formData.append('fuel_type',document.querySelector('input[name="fuel_type"]:checked').value)
            formData.append('transmission',document.querySelector('input[name="transmission"]:checked').value)

            //upload files
            formData.append('num_files',document.getElementById("photo-upload").files.length)
            for(var v =0; v<document.getElementById("photo-upload").files.length;v++){
                console.log(document.getElementById("photo-upload").files[v])
                formData.append('img'+v,document.getElementById("photo-upload").files[v],`${v+1}.jpg`)
            }

            try {
                // Send a POST request to Flask
                const response = await fetch( "http://localhost:5000/api/car",
                    {   method: "POST",
                        body: formData,
                    });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Request failed");

                document.getElementById("result").textContent = data.Message;
                form.reset();

            } catch (error) {
                console.log(error)
                document.getElementById("result").textContent =error.message;
            }

        });
    </script>
</body>
</html>
